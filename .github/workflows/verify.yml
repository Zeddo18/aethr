name: Verify AETHR
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate reproducible migration lockfile preview (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const fs=require("fs");const s=fs.readFileSync("package-lock.json","utf8");for(let i=0;i<s.length;i+=4000)console.log("AETHR_LOCK_CHUNK:"+i+":"+JSON.stringify(s.slice(i,i+4000)));console.log("AETHR_LOCK_SIZE:"+s.length)'
      - run: npm ci
      - name: Block high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report remaining development dependency advisories (informational)
        if: always()
        run: npm audit --audit-level=moderate || true
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
