name: Verify AETHR
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test Supabase SQL policies with two simulated accounts
        run: |
          set -euo pipefail
          CONTAINER="${{ job.services.postgres.id }}"
          test -n "$CONTAINER"
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < tests/db/bootstrap.sql
          for file in supabase/schema.sql supabase/phase2.sql supabase/phase4.sql supabase/phase5.sql supabase/phase6.sql supabase/phase8.sql supabase/phase9.sql supabase/phase15.sql; do
            echo "Applying CI fixture schema $file"
            docker exec -i "$CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < "$file"
          done
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < tests/db/seed.sql
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < tests/db/isolation.sql
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < tests/db/ai-quota.sql
          docker exec -i "$CONTAINER" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < supabase/verify_security.sql
      - run: npm ci
      - name: Block high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Block moderate or higher vulnerabilities across all dependencies
        run: npm audit --audit-level=moderate
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
