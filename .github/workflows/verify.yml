name: Verify AETHR
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Block high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Report remaining development dependency advisories (informational)
        if: always()
        run: npm audit --audit-level=moderate || true
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
